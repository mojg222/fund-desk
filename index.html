<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운용데스크</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b7a75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="운용데스크">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 모바일 우선 단일 컬럼(최대 560px), 상단 고정 헤더 + 하단 탭바. 한국 증시 관례에 맞춰 상승=빨강, 하락=파랑 */
:root{
  --bg:#f3f5f8;--card:#ffffff;--ink:#14202b;--ink2:#4f5d6b;--mute:#8492a0;--line:#e2e7ed;
  --accent:#0b7a75;--accent-ink:#ffffff;--accent-soft:#e0f3f1;
  --up:#d93a2f;--dn:#2563d6;
  --s-hi:#0b7a75;--s-mid:#5b6b7c;--s-lo:#c2570c;
  --g-buy:#0b8a5a;--g-hold:#5b6b7c;--g-watch:#a8741a;--g-reduce:#cc5f12;--g-exit:#b4236b;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.05);
  --font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d141a;--card:#16202a;--ink:#e8eef4;--ink2:#aab7c4;--mute:#7b8997;--line:#25333f;
  --accent:#3cc4bb;--accent-ink:#06201f;--accent-soft:#11302e;--up:#ff6b61;--dn:#6ea3ff;
  --s-hi:#3cc4bb;--s-mid:#93a3b4;--s-lo:#f0934a;--g-buy:#3fd596;--g-hold:#93a3b4;--g-watch:#e1b04e;--g-reduce:#f0934a;--g-exit:#f06aa8;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141a;--card:#16202a;--ink:#e8eef4;--ink2:#aab7c4;--mute:#7b8997;--line:#25333f;
  --accent:#3cc4bb;--accent-ink:#06201f;--accent-soft:#11302e;--up:#ff6b61;--dn:#6ea3ff;
  --s-hi:#3cc4bb;--s-mid:#93a3b4;--s-lo:#f0934a;--g-buy:#3fd596;--g-hold:#93a3b4;--g-watch:#e1b04e;--g-reduce:#f0934a;--g-exit:#f06aa8;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mute{color:var(--mute)}.ink2{color:var(--ink2)}

#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr h1{margin:0;font-size:19px;letter-spacing:-.02em;text-wrap:balance}
.asof{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--g-watch) 13%,var(--card));border:1px solid color-mix(in srgb,var(--g-watch) 35%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner button{flex:none}

.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;letter-spacing:-.01em}
.card h2 small{font-weight:400;color:var(--mute);margin-left:6px;font-size:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}
.sec-h h2{margin:0;font-size:15px}
.sec-h span{font-size:12px;color:var(--mute)}

.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:transparent;color:var(--g-exit);border:1px solid color-mix(in srgb,var(--g-exit) 45%,transparent)}
.btn.block{width:100%;padding:12px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:12px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--mute)}
.tile .v{font-size:18px;font-weight:700;letter-spacing:-.02em}
.tile .s{font-size:12px;color:var(--ink2)}
.big{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.2}

.chip{--c:var(--ink2);display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.chip.tag{font-weight:500;padding:0 7px;font-size:11.5px}
.g-buy{--c:var(--g-buy)}.g-hold{--c:var(--g-hold)}.g-watch{--c:var(--g-watch)}.g-reduce{--c:var(--g-reduce)}.g-exit{--c:var(--g-exit)}
.c-buy{--c:var(--up)}.c-sell{--c:var(--dn)}.c-own{--c:var(--accent)}

.ring{--sz:44px;width:var(--sz);height:var(--sz);flex:none;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-weight:700;font-size:calc(var(--sz)*.34);font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .nm{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .sub{font-size:12px;color:var(--mute)}
.item .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.item .px{text-align:right;min-width:74px}
.item .px b{display:block;font-weight:600}
.item .px small{font-size:12px}
.rk{width:26px;text-align:center;flex:none}
.rk b{font-size:17px;display:block;line-height:1.1}
.rk small{font-size:11px;font-weight:600}
.rk.first b{color:var(--accent)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:color-mix(in srgb,var(--mute) 16%,transparent);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px;border-radius:9px;font-weight:600;color:var(--ink2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.datebar{display:flex;align-items:center;gap:8px;margin:12px 0}
.datebar input{flex:1;min-width:0;text-align:center}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;flex:none}
.iconbtn[disabled]{opacity:.35}

.sugg{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.sugg:first-child{border-top:0}
.sugg .ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.sugg b{display:block;font-weight:600;font-size:14px}
.sugg p{margin:1px 0 0;font-size:13px;color:var(--ink2)}
.k-warn{--c:var(--g-watch)}.k-exit{--c:var(--g-exit)}.k-reduce{--c:var(--g-reduce)}.k-add{--c:var(--g-buy)}.k-new{--c:var(--accent)}.k-info{--c:var(--g-hold)}

.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;background:var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.part{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.part+.expl{font-size:12px;color:var(--mute);margin:2px 0 8px 70px}

.chart{display:block;width:100%;height:auto;touch-action:pan-y}
.chart text{fill:var(--mute);font-size:9px;font-family:var(--font)}
.c-px{stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linejoin:round}
.c-m20{stroke:#d28a00;fill:none;stroke-width:1.2}
.c-m60{stroke:#8a63d2;fill:none;stroke-width:1.2}
.c-grid{stroke:var(--line);stroke-width:1}
.c-xh{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3}
.c-fup{fill:var(--up)}.c-fdn{fill:var(--dn)}
.rd{font-size:12px;color:var(--ink2);min-height:18px;margin:4px 0}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}

label.f{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:15px}
textarea.in{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.res{border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden}
.res button{display:flex;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--line);background:var(--card);padding:9px 12px;text-align:left}
.res button:first-child{border-top:0}
.slider{display:grid;grid-template-columns:70px 1fr 48px;gap:8px;align-items:center;font-size:14px;margin:8px 0}
.slider input{width:100%;accent-color:var(--accent)}
.slider output{text-align:right}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:8px 0 9px;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:500}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}

#sheet-wrap{position:fixed;inset:0;z-index:50;display:none}
#sheet-wrap.on{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,14,20,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet .hd h2{margin:0;font-size:19px;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:60;max-width:90%;text-align:center}
.empty{text-align:center;color:var(--ink2);padding:18px 8px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.foot{font-size:11.5px;color:var(--mute);margin:18px 2px 0;line-height:1.6}
.day{font-size:12px;color:var(--mute);margin:14px 2px 4px;font-weight:600}
.trade{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.trade:first-of-type{border-top:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* 확장: 매크로·아이디어·일정 */
.chg{display:flex;flex-direction:column;font-size:13px;line-height:1.25}
.chg small{font-size:11px;color:var(--mute)}
.icard .main{min-width:0}
.card.item{background:var(--card);border-radius:14px;padding:12px;border:0;margin-bottom:12px}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);flex:none}
select.in{appearance:auto}
[hidden]{display:none !important}
@media (min-width:700px){
  #app{max-width:720px}
  .sheet{max-width:680px;border-radius:20px;bottom:4%}
  .nav div{max-width:720px}
  .tiles{grid-template-columns:repeat(4,1fr)}
}

.evr{border-top:1px solid var(--line)}
.card>.evr:first-of-type,.card>.evr:first-child{border-top:0}

</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* 운용데스크 core: 지표, 매력도 점수, 신호, 포트폴리오 계산, 샘플 데이터, CSV 파서 (DOM 의존 없음) */
const FD = (function () {
  const DEF_W = { trend: 30, flow: 30, mom: 20, vol: 10, risk: 10 };
  const VAL_SHARE = 0.5; // 가치/안전성 지표에서 밸류에이션이 차지하는 비중
  /* 매력도 가중치 프리셋 (합계 100). 중장기형은 가치/안전성을 크게, 단기형은 추세·수급·모멘텀을 크게 */
  const PROFILES = {
    short: { label: '단기형', desc: '며칠~몇 주 단위 매매. 추세·수급·모멘텀을 크게 보고 가치/안전성은 낮게 반영합니다.', W: { trend: 30, flow: 30, mom: 25, vol: 10, risk: 5 } },
    long: { label: '중장기형', desc: '수개월~1년 이상 보유. 밸류에이션과 변동성·낙폭을 합친 가치/안전성을 가장 크게 보고 추세·수급 비중은 낮춥니다.', W: { trend: 25, flow: 15, mom: 10, vol: 5, risk: 45 } },
  };
  const DEF_CFG = { maxWeight: 25, stopLoss: 8, takeProfit: 25, minTV: 10 };
  const MIN_IDX = 65; // 60일선·MACD 안정화에 필요한 최소 봉 수

  const clamp = (x, a = 0, b = 100) => Math.max(a, Math.min(b, x));
  const scale = (x, lo, hi) => clamp(((x - lo) / (hi - lo)) * 100);
  const sum = (a) => a.reduce((s, x) => s + x, 0);

  /* ---------- 지표 ---------- */
  function emaArr(a, n) {
    const k = 2 / (n + 1), out = [];
    let e = null;
    for (let i = 0; i < a.length; i++) { e = e === null ? a[i] : a[i] * k + e * (1 - k); out.push(e); }
    return out;
  }
  function rsiAt(c, n, end) {
    if (end < n) return null;
    let g = 0, l = 0;
    for (let i = end - n + 1; i <= end; i++) { const d = c[i] - c[i - 1]; if (d > 0) g += d; else l -= d; }
    if (g + l === 0) return 50;
    if (l === 0) return 100;
    return 100 - 100 / (1 + g / l);
  }
  function getInd(st) {
    if (st._ind) return st._ind;
    const c = st.c, n = c.length, ma20 = [], ma60 = [];
    let s20 = 0, s60 = 0;
    for (let i = 0; i < n; i++) {
      s20 += c[i]; s60 += c[i];
      if (i >= 20) s20 -= c[i - 20];
      if (i >= 60) s60 -= c[i - 60];
      ma20.push(i >= 19 ? s20 / 20 : null);
      ma60.push(i >= 59 ? s60 / 60 : null);
    }
    const e12 = emaArr(c, 12), e26 = emaArr(c, 26);
    const macd = e12.map((x, i) => x - e26[i]);
    const sig = emaArr(macd, 9);
    const hist = macd.map((x, i) => x - sig[i]);
    const rsi = c.map((_, i) => rsiAt(c, 14, i));
    st._ind = { ma20, ma60, macd, sig, hist, rsi };
    return st._ind;
  }
  function idxOf(st, d) {
    if (!st._idx) { st._idx = new Map(); st.d.forEach((x, i) => st._idx.set(x, i)); }
    const v = st._idx.get(d);
    return v === undefined ? null : v;
  }
  // 구간 보간: pts=[[x,y],...] x 오름차순
  function interp(x, pts) {
    if (x <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      if (x <= pts[i][0]) {
        const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
        return y0 + ((x - x0) / (x1 - x0)) * (y1 - y0);
      }
    }
    return pts[pts.length - 1][1];
  }

  /* ---------- 매력도 점수 ---------- */
  function wKey(W) { return [W.trend, W.flow, W.mom, W.vol, W.risk].join(','); }

  /* 밸류에이션(OpenDART 재무 + 시가총액으로 자동 계산한 PER·PBR·ROE) → 0~100점. per/pbr이 0 이하면 적자·자본잠식. 높을수록 저평가.
     PER은 낮을수록, PBR은 낮을수록 좋고, ROE가 있으면 PBR을 'ROE÷10 대비 PBR'(적정 PBR 대비)로 보정. 입력된 항목의 평균 */
  function valScore(v) {
    const c = [];
    const ok = (x) => typeof x === 'number' && isFinite(x);
    if (ok(v.per)) c.push(v.per <= 0 ? 10 : interp(v.per, [[3, 95], [6, 90], [10, 75], [15, 58], [20, 45], [30, 28], [50, 10], [100, 5]]));
    if (ok(v.pbr)) {
      if (v.pbr <= 0) c.push(10);
      else if (ok(v.roe)) c.push(v.roe <= 0 ? 15 : interp(v.pbr / (v.roe / 10), [[0.3, 98], [0.5, 95], [0.8, 80], [1, 62], [1.5, 42], [2.5, 22], [4, 8]]));
      else c.push(interp(v.pbr, [[0.3, 95], [0.6, 88], [1, 70], [1.5, 55], [2.5, 38], [4, 22], [8, 8]]));
    } else if (ok(v.roe)) c.push(interp(v.roe, [[0, 15], [5, 35], [10, 55], [15, 72], [25, 90]]));
    return c.length ? Math.max(0, Math.min(100, c.reduce((a, b) => a + b, 0) / c.length)) : null;
  }

  /* 종목 검색: 공백·대소문자 무시, 여러 단어는 모두 포함, 이름 앞부분 일치를 먼저 */
  function searchStocks(stocks, q, limit) {
    q = String(q || '').trim().toLowerCase();
    if (!q) return [];
    const nq = q.replace(/\s+/g, ''), toks = q.split(/\s+/).filter(Boolean), out = [];
    for (const s of stocks) {
      const nn = s.name.toLowerCase().replace(/\s+/g, '');
      let sc = 0;
      if (s.code === q) sc = 100; else if (nn === nq) sc = 95; else if (s.code.startsWith(q)) sc = 90; else if (nn.startsWith(nq)) sc = 80;
      else if (nn.includes(nq)) sc = 60; else if (toks.length > 1 && toks.every((x) => nn.includes(x))) sc = 50; else if (s.code.includes(q)) sc = 40;
      if (sc) out.push([sc, s]);
    }
    out.sort((a, b) => b[0] - a[0] || a[1].name.length - b[1].name.length);
    return out.slice(0, limit || 8).map((x) => x[1]);
  }

  function scoreAt(st, t, W) {
    if (t == null || t < MIN_IDX || t >= st.c.length) return null;
    const key = t + '|' + wKey(W) + (st.val ? '|v' + st.val.per + ',' + st.val.pbr + ',' + st.val.roe : '');
    st._sc = st._sc || {};
    if (st._sc[key]) return st._sc[key];

    const ind = getInd(st), c = st.c, v = st.v;
    const px = c[t], ma20 = ind.ma20[t], ma60 = ind.ma60[t];
    const rsi = ind.rsi[t], hist = ind.hist[t], histPrev = ind.hist[t - 1];

    // 거래대금(억원) 20일 평균, 수급 합계
    let tv20 = 0, f5 = 0, i5 = 0, f20 = 0, i20 = 0, v5 = 0, v20 = 0;
    for (let k = t - 19; k <= t; k++) {
      tv20 += (c[k] * v[k]) / 1e8; f20 += st.f[k]; i20 += st.i[k]; v20 += v[k];
      if (k > t - 5) { f5 += st.f[k]; i5 += st.i[k]; v5 += v[k]; }
    }
    tv20 /= 20; v20 /= 20; v5 /= 5;
    const flow5 = f5 + i5, flow20 = f20 + i20;
    let streak = 0;
    for (let k = t; k > t - 5; k--) { if (st.f[k] + st.i[k] > 0) streak++; else break; }

    const ret1 = c[t] / c[t - 1] - 1, ret5 = c[t] / c[t - 5] - 1, ret20 = c[t] / c[t - 20] - 1;
    let m1 = 0, m2 = 0;
    for (let k = t - 19; k <= t; k++) { const r = c[k] / c[k - 1] - 1; m1 += r; m2 += r * r; }
    m1 /= 20;
    const vol20 = Math.sqrt(Math.max(0, m2 / 20 - m1 * m1)) * 100; // 일간 변동성 %
    let hi = 0;
    for (let k = Math.max(0, t - 119); k <= t; k++) hi = Math.max(hi, c[k]);
    const dd = px / hi - 1;
    const overext = px / ma20 - 1;
    const vr = v20 > 0 ? v5 / v20 : 1;

    // 1) 추세
    let trend = 0;
    if (px > ma20) trend += 25;
    if (px > ma60) trend += 25;
    if (ma20 > ma60) trend += 25;
    if (ma60 > ind.ma60[t - 5]) trend += 25;

    // 2) 모멘텀
    const rsiS = interp(rsi, [[0, 30], [30, 40], [50, 60], [65, 100], [75, 70], [90, 20], [100, 10]]);
    const macdS = hist > 0 && hist > histPrev ? 100 : hist > 0 ? 70 : hist > histPrev ? 45 : 10;
    const mom = 0.4 * rsiS + 0.3 * macdS + 0.3 * scale(ret20, -0.1, 0.15);

    // 3) 수급 (외국인+기관, 거래대금 대비)
    const r5 = tv20 > 0 ? flow5 / tv20 : 0, r20 = tv20 > 0 ? flow20 / tv20 : 0;
    const both = f5 > 0 && i5 > 0 ? 100 : f5 > 0 || i5 > 0 ? 50 : 0;
    const noFlow = !!st.noFlow;
    const flow = noFlow ? 50 : 0.4 * scale(r5, -0.4, 0.8) + 0.35 * scale(r20, -1, 2) + 0.15 * (streak / 5) * 100 + 0.1 * both;

    // 4) 거래량
    const vs = scale(vr, 0.7, 1.8);
    const vol = ret5 > 0 ? vs : 60 - vs * 0.6;

    // 5) 가치/안전성: 변동성·낙폭·과열(안전성)에 밸류에이션 점수(OpenDART 자동)를 절반씩 결합. 밸류에이션 자료가 없는 종목은 안전성만 사용
    const safe = 0.4 * (100 - scale(vol20, 1, 4)) + 0.3 * scale(dd, -0.25, 0) + 0.3 * (100 - scale(overext, 0.06, 0.2));
    const val = st.val ? valScore(st.val) : null;
    const risk = val == null ? safe : safe * (1 - VAL_SHARE) + val * VAL_SHARE;

    const parts = { trend, mom, flow, vol, risk, safe };
    if (val != null) parts.val = val;
    const wf = noFlow ? 0 : W.flow;
    const wsum = W.trend + wf + W.mom + W.vol + W.risk || 1;
    const total = (W.trend * trend + wf * flow + W.mom * mom + W.vol * vol + W.risk * risk) / wsum;

    const res = {
      total, parts, noFlow, val, valIn: st.val || null,
      metrics: { px, ma20, ma60, rsi, hist, ret1, ret5, ret20, flow5, flow20, foreign5: f5, inst5: i5, vr, vol20, dd, overext, streak, tv20 },
    };
    st._sc[key] = res;
    return res;
  }

  function tags(sc) {
    const m = sc.metrics, out = [];
    if (m.px > m.ma20 && m.ma20 > m.ma60) out.push('정배열');
    else if (m.px < m.ma60) out.push('60일선 하회');
    if (sc.noFlow) { /* 수급 데이터 없음 */ }
    else if (m.foreign5 > 0 && m.inst5 > 0) out.push('외인·기관 동반매수');
    else if (m.flow5 < 0 && m.flow20 < 0) out.push('수급 이탈');
    else if (m.foreign5 > 0) out.push('외인 순매수');
    else if (m.inst5 > 0) out.push('기관 순매수');
    if (m.rsi > 75) out.push('과열 주의');
    else if (m.rsi >= 50 && m.hist > 0) out.push('모멘텀 양호');
    if (m.vr >= 1.3 && m.ret5 > 0) out.push('거래량 증가');
    if (sc.val != null && sc.val >= 70) out.unshift('저평가 구간');
    else if (sc.val != null && sc.val <= 30) out.unshift('고평가 구간');
    return out.slice(0, 3);
  }

  /* ---------- 전략 신호 ---------- */
  function signal(sc, o) {
    const m = sc.metrics, cfg = o.cfg || DEF_CFG, held = !!o.held, p = o.pnlPct, reasons = [];
    const t = sc.total;
    const trendBroken = m.px < m.ma60 && m.ma20 < m.ma60;
    const fk = !sc.noFlow;
    const flowOut = fk && m.flow5 < 0 && m.flow20 < 0;
    const weak = fk ? m.flow5 < 0 : m.ret5 < 0, strong = fk ? m.flow5 > 0 : true;
    let level = 'watch';
    if (held && p != null && p <= -cfg.stopLoss) {
      level = 'exit'; reasons.push(`평단 대비 ${p.toFixed(1)}%로 손절 기준(-${cfg.stopLoss}%)에 도달했습니다.`);
    } else if (trendBroken && flowOut) {
      level = 'exit'; reasons.push('60일선 아래에서 외국인·기관 수급이 20일·5일 모두 순매도입니다.');
    } else if (t < 45 || (m.px < m.ma20 && m.hist < 0 && weak) || (held && m.rsi > 78) ||
      (held && p != null && p >= cfg.takeProfit && m.rsi > 70)) {
      level = 'reduce';
      if (t < 45) reasons.push(`종합 매력도가 ${t.toFixed(0)}점으로 낮습니다.`);
      if (m.px < m.ma20 && m.hist < 0 && weak) reasons.push(fk ? '20일선 이탈, MACD 약세, 최근 5일 수급 순매도가 겹쳤습니다.' : '20일선 이탈, MACD 약세, 최근 5일 하락이 겹쳤습니다.');
      if (held && m.rsi > 78) reasons.push(`RSI ${m.rsi.toFixed(0)}로 단기 과열 구간입니다. 분할 익절을 검토하세요.`);
      if (held && p != null && p >= cfg.takeProfit && m.rsi > 70) reasons.push(`수익률 ${p.toFixed(1)}%로 익절 기준(+${cfg.takeProfit}%)을 넘었고 RSI가 높습니다.`);
    } else if (t >= 68 && m.px > m.ma20 && m.rsi < 72 && strong) {
      level = 'buy';
      reasons.push(fk ? `종합 ${t.toFixed(0)}점, 20일선 위 상승추세에 최근 5일 수급이 순매수입니다.` : `종합 ${t.toFixed(0)}점, 20일선 위 상승추세입니다. (수급 데이터 없음)`);
    } else if (t >= 50) {
      level = 'hold';
      reasons.push(`종합 ${t.toFixed(0)}점으로 뚜렷한 매수·매도 신호는 없습니다.`);
    } else {
      reasons.push(`종합 ${t.toFixed(0)}점으로 추세·수급이 엇갈립니다. 확인 후 대응하세요.`);
    }
    const L = {
      buy: held ? '추가매수 고려' : '신규 매수 후보',
      hold: held ? '보유 유지' : '관망',
      watch: held ? '주의 관찰' : '관망',
      reduce: held ? '비중축소 검토' : '매수 비추천',
      exit: held ? '매도 경고' : '진입 금지',
    };
    return { level, label: L[level], reasons };
  }

  /* ---------- 일자별 랭킹 ---------- */
  function rankAt(stocks, market, date, W, minTV) {
    const out = [];
    for (const st of stocks) {
      if (market && st.market !== market) continue;
      const t = idxOf(st, date);
      if (t == null || t < MIN_IDX) continue;
      const sc = scoreAt(st, t, W);
      if (!sc || sc.metrics.tv20 < (minTV || 0)) continue;
      out.push({ st, t, sc });
    }
    out.sort((a, b) => b.sc.total - a.sc.total);
    out.forEach((o, i) => (o.rank = i + 1));
    return out;
  }

  function marketStats(stocks, market, date, W) {
    let n = 0, above = 0, up = 0, dn = 0, flow5 = 0, scs = 0;
    for (const st of stocks) {
      if (st.market !== market) continue;
      const t = idxOf(st, date);
      if (t == null || t < MIN_IDX) continue;
      const sc = scoreAt(st, t, W);
      n++; scs += sc.total;
      if (sc.metrics.px > sc.metrics.ma20) above++;
      if (sc.metrics.ret1 > 0) up++; else if (sc.metrics.ret1 < 0) dn++;
      flow5 += sc.metrics.flow5;
    }
    return { n, above: n ? (above / n) * 100 : 0, up, dn, flow5, avg: n ? scs / n : 0 };
  }

  /* ---------- 매매 / 포지션 (이동평균법) ---------- */
  function computePositions(trades) {
    const sorted = trades.slice().sort((a, b) => (a.date === b.date ? a.id - b.id : a.date < b.date ? -1 : 1));
    const pos = {}, rpnl = {}, over = {};
    for (const t of sorted) {
      const p = pos[t.code] || (pos[t.code] = { code: t.code, qty: 0, cost: 0, realized: 0 });
      const fee = t.fee || 0;
      if (t.side === 'buy') { p.cost += t.qty * t.price + fee; p.qty += t.qty; }
      else {
        const avg = p.qty ? p.cost / p.qty : 0;
        const q = Math.min(t.qty, p.qty);
        if (t.qty > p.qty) over[t.id] = true;
        const pnl = q * t.price - fee - q * avg;
        rpnl[t.id] = { pnl, pct: avg ? (t.price / avg - 1) * 100 : 0 };
        p.realized += pnl; p.cost -= q * avg; p.qty -= q;
        if (p.qty === 0) p.cost = 0;
      }
    }
    for (const k in pos) pos[k].avg = pos[k].qty ? pos[k].cost / pos[k].qty : 0;
    return { pos, rpnl, over };
  }

  /* ---------- 포트폴리오 분석 ---------- */
  function analyzePortfolio(trades, byCode, date, W, cfg, cash) {
    const { pos } = computePositions(trades);
    const rows = [];
    for (const code in pos) {
      const p = pos[code];
      if (p.qty <= 0) continue;
      const st = byCode[code];
      const t = st ? idxOf(st, date) : null;
      const px = t != null ? st.c[t] : null;
      const sc = t != null ? scoreAt(st, t, W) : null;
      const mv = px != null ? px * p.qty : p.cost;
      const pnl = mv - p.cost;
      const pnlPct = p.cost ? (pnl / p.cost) * 100 : 0;
      const sig = sc ? signal(sc, { held: true, pnlPct, cfg }) : null;
      rows.push({ code, st, qty: p.qty, avg: p.avg, cost: p.cost, px, mv, pnl, pnlPct, sc, sig, noData: px == null });
    }
    const mvTotal = sum(rows.map((r) => r.mv)), costTotal = sum(rows.map((r) => r.cost));
    const totalAsset = mvTotal + (cash || 0);
    rows.forEach((r) => (r.weight = totalAsset ? r.mv / totalAsset : 0));
    rows.sort((a, b) => b.mv - a.mv);
    const scored = rows.filter((r) => r.sc);
    const scMv = sum(scored.map((r) => r.mv));
    const wScore = scMv ? sum(scored.map((r) => r.sc.total * r.mv)) / scMv : null;
    const grp = (f) => { const o = {}; rows.forEach((r) => { const k = f(r); o[k] = (o[k] || 0) + r.mv; }); return o; };
    const sectorW = grp((r) => (r.st && r.st.sector) || '기타');
    const marketW = grp((r) => (r.st && r.st.market) || '기타');
    const hhi = mvTotal ? sum(rows.map((r) => Math.pow(r.mv / mvTotal, 2))) : 0;
    return {
      rows, mvTotal, costTotal, pnl: mvTotal - costTotal, pnlPct: costTotal ? ((mvTotal - costTotal) / costTotal) * 100 : 0,
      cash: cash || 0, totalAsset, wScore, sectorW, marketW, hhi, cashPct: totalAsset ? ((cash || 0) / totalAsset) * 100 : 0,
      realized: sum(Object.values(pos).map((p) => p.realized)),
    };
  }

  function suggestions(an, stocks, date, W, cfg) {
    const out = [], held = new Set(an.rows.map((r) => r.code));
    for (const r of an.rows) {
      if (r.weight * 100 > cfg.maxWeight) {
        const excess = r.mv - (cfg.maxWeight / 100) * an.totalAsset;
        const shares = r.px ? Math.ceil(excess / r.px) : 0;
        out.push({ pri: 1, kind: 'warn', code: r.code, title: `${r.st ? r.st.name : r.code} 비중 ${(r.weight * 100).toFixed(1)}%`,
          body: `종목 한도 ${cfg.maxWeight}%를 넘었습니다. 한도에 맞추려면 약 ${shares.toLocaleString('ko-KR')}주를 줄이면 됩니다.` });
      }
    }
    for (const r of an.rows) {
      if (!r.sig) continue;
      const nm = r.st.name;
      if (r.sig.level === 'exit') out.push({ pri: 2, kind: 'exit', code: r.code, title: `${nm} ${r.sig.label}`, body: r.sig.reasons[0] });
      else if (r.sig.level === 'reduce') out.push({ pri: 3, kind: 'reduce', code: r.code, title: `${nm} ${r.sig.label}`, body: r.sig.reasons[0] });
    }
    const sectors = Object.entries(an.sectorW).sort((a, b) => b[1] - a[1]);
    if (sectors.length && an.mvTotal && sectors[0][1] / an.mvTotal > 0.5 && an.rows.length > 1) {
      out.push({ pri: 4, kind: 'warn', title: `${sectors[0][0]} 업종 쏠림 ${((sectors[0][1] / an.mvTotal) * 100).toFixed(0)}%`, body: '한 업종이 보유 평가금액의 절반을 넘습니다. 업종을 분산하는 편이 변동성에 유리합니다.' });
    }
    for (const r of an.rows) {
      if (r.sig && r.sig.level === 'buy' && r.weight * 100 < cfg.maxWeight * 0.6) {
        out.push({ pri: 6, kind: 'add', code: r.code, title: `${r.st.name} ${r.sig.label}`, body: r.sig.reasons[0] });
      }
    }
    for (const mk of ['KOSPI', 'KOSDAQ']) {
      const rk = rankAt(stocks, mk, date, W, cfg.minTV).slice(0, 5);
      for (const o of rk) {

        const sg = signal(o.sc, { held: false, cfg });

          out.push({ pri: 7, kind: 'new', code: o.st.code, title: `${o.st.name} 신규 편입 후보 (${mk} ${o.rank}위)`, body: sg.reasons[0] });
        }
      }
    }
    if (an.rows.length) {
      if (an.cashPct < 5) out.push({ pri: 5, kind: 'info', title: `현금 비중 ${an.cashPct.toFixed(1)}%`, body: '신규 매수나 추가매수 여력이 적습니다. 비중축소 후보를 정리해 현금을 확보해 두세요.' });
      else if (an.cashPct > 40) out.push({ pri: 8, kind: 'info', title: `현금 비중 ${an.cashPct.toFixed(1)}%`, body: '현금이 많습니다. 매수 후보 종목을 나눠서 편입하는 방안을 검토하세요.' });
      if (an.wScore != null && an.wScore < 50) out.push({ pri: 4, kind: 'warn', title: `포트 평균 매력도 ${an.wScore.toFixed(0)}점`, body: '보유 종목의 추세·수급이 전반적으로 약합니다. 하위 종목부터 점검하세요.' });
    }
    out.sort((a, b) => a.pri - b.pri);
    return out;
  }

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    if (!UI.rankDate || !G.rankDates.includes(UI.rankDate)) UI.rankDate = G.asOf;
  }

  /* ---------- 저장 ---------- */
  const store = {
    ref: null, timer: null,
    async init() {
      try {
        if (typeof claude === 'undefined' || !claude.use) return;
        const user = await claude.use('user'), db = await claude.use('db');
        if (user && db) { const id = await user.id(); this.ref = db.collection('data/users/' + id).doc('state'); }
      } catch (e) { this.ref = null; }
    },
    async load() {
      let data = null;
      if (this.ref) {
        try {
          const snap = await Promise.race([this.ref.get(), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 6000))]);
          const raw = snap && (typeof snap.data === 'function' ? snap.data() : snap);
          if (raw && raw.json) data = JSON.parse(raw.json);
        } catch (e) { /* 로컬 저장소로 대체 */ }
      }
      if (!data) { try { data = JSON.parse(localStorage.getItem('fd_state') || 'null'); } catch (e) { /* 없음 */ } }
      return data;
    },
    save() {
      clearTimeout(this.timer);
      this.timer = setTimeout(() => {
        const json = stateJSON();
        try { localStorage.setItem('fd_state', json); } catch (e) { /* 무시 */ }
        if (this.ref) { try { Promise.resolve(this.ref.set({ json, t: Date.now() })).catch(() => {}); } catch (e) { /* 무시 */ } }
      }, 400);
    },
  };
  function applyState(d) {
    if (!d) return;
    if (Array.isArray(d.trades)) S.trades = d.trades.filter((t) => t && t.code && t.qty > 0 && t.price > 0);
    if (Array.isArray(d.ideas)) S.ideas = d.ideas.filter((i) => i && i.id && i.title).map((i) => Object.assign({ log: [], checks: {}, buybacks: [], stake: {}, capex: {}, conviction: 3, status: 'watch', type: 'other' }, i));
    if (Array.isArray(d.events)) S.events = d.events.filter((e) => e && e.id && e.date && e.title);
    if (Array.isArray(d.watch)) S.watch = d.watch.filter((w) => w && w.code).map((w) => ({ code: String(w.code), date: w.date || '', px: +w.px || 0, memo: w.memo || '' }));
    S.cash = +d.cash || 0;
    S.nextId = Math.max(+d.nextId || 1, S.trades.reduce((m, t) => Math.max(m, t.id || 0), 0) + 1, S.ideas.reduce((m, t) => Math.max(m, t.id || 0), 0) + 1, S.events.reduce((m, t) => Math.max(m, t.id || 0), 0) + 1);
    if (d.W) S.W = Object.assign({}, FD_.DEF_W, d.W);
    S.customW = d.customW && typeof d.customW === 'object' ? Object.assign({}, FD_.DEF_W, d.customW) : null;
    S.profile = ['short', 'long', 'custom', 'default'].includes(d.profile) ? d.profile : detectProfile();
    if (d.cfg) S.cfg = Object.assign({}, FD_.DEF_CFG, d.cfg);
  }
  async function loadData() {
    const to = (ms) => new Promise((_, r) => setTimeout(() => r(new Error('timeout')), ms));
    const lastOf = (a) => a.reduce((m, st) => (st.d[st.d.length - 1] > m ? st.d[st.d.length - 1] : m), '');
    let mk = null, mc = null, src = 'sample';
    try { const c = await kv.get('market'); if (c && c.stocks && c.stocks.length) { mk = c.stocks; src = 'saved'; } } catch (e) { /* 샘플 */ }
    try { const c = await kv.get('macro'); if (c && c.series) mc = c; } catch (e) { /* 샘플 */ }
    try { // 호스팅 환경의 자동 갱신 파일
      const r = await Promise.race([fetch('data/market.csv', { cache: 'no-cache' }), to(12000)]);
      if (r && r.ok) { const p = FD_.parseMarketCSV(await r.text(), 'won'); if (!p.error && (!mk || lastOf(p.stocks) >= lastOf(mk))) { mk = p.stocks; src = 'auto'; kv.set('market', { stocks: p.stocks.map(slim) }); } }
    } catch (e) { /* 파일 없음 */ }
    try {
      const r = await Promise.race([fetch('data/macro.json', { cache: 'no-cache' }), to(12000)]);
      if (r && r.ok) { const p = FD_.parseMacro(await r.text()); if (p.macro && (!mc || p.macro.asof >= mc.asof)) { mc = p.macro; kv.set('macro', mc); } }
    } catch (e) { /* 파일 없음 */ }
    try { const r = await Promise.race([fetch('data/valuation.json', { cache: 'no-cache' }), to(20000)]); if (r && r.ok) { const j = await r.json(); if (j && j.stocks) VAL = j; } } catch (e) { /* 밸류에이션 자료 없음 */ }
    try { const r = await Promise.race([fetch('data/events.json', { cache: 'no-cache' }), to(15000)]); if (r && r.ok) { const j = await r.json(); if (j && Array.isArray(j.items)) EVT = j; } } catch (e) { /* 이벤트 없음 */ }
    try { const r = await Promise.race([fetch('data/dart.json', { cache: 'no-cache' }), to(12000)]); if (r && r.ok) { const j = await r.json(); if (j && j.stocks) DART = j; } } catch (e) { /* 공시 없음 */ }
    try { const r = await Promise.race([fetch('data/news.json', { cache: 'no-cache' }), to(12000)]); if (r && r.ok) { const j = await r.json(); if (j && j.stocks) NEWS = j; } } catch (e) { /* 뉴스 없음 */ }
    if (mk) setData(mk, false); else setData(FD_.genSample(SAMPLE_END, 260), true);
    G.source = src;
    M = mc ? Object.assign({}, mc, { isSample: false }) : Object.assign({}, FD_.genMacroSample(SAMPLE_END), { isSample: true });
  }

  /* ---------- 공통 조각 ---------- */
  const ICON = { buy: '＋', hold: '＝', watch: '!', reduce: '↓', exit: '✕' };
  const chipSig = (sg) => `<span class="chip g-${sg.level}"><span aria-hidden="true">${ICON[sg.level]}</span>${esc(sg.label)}</span>`;
  const ring = (v, sz) => `<div class="ring" style="--p:${v.toFixed(0)};--rc:${v >= 70 ? 'var(--s-hi)' : v >= 50 ? 'var(--s-mid)' : 'var(--s-lo)'};--sz:${sz || 44}px" role="img" aria-label="매력도 ${v.toFixed(0)}점"><span>${v.toFixed(0)}</span></div>`;
  const heldQty = () => { const { pos } = FD_.computePositions(S.trades); return pos; };
  const PART = [['trend', '추세'], ['flow', '수급'], ['mom', '모멘텀'], ['vol', '거래량'], ['risk', '가치/안전성']];
  let toastT;
  function toast(msg) {
    let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = msg; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => (el.style.display = 'none'), 2600);
  }
  function prevDateOf(d) { const i = G.rankDates.indexOf(d); return i > 0 ? G.rankDates[i - 1] : null; }

  function rankRows(mk, date) {
    const rk = FD_.rankAt(G.stocks, mk, date, S.W, S.cfg.minTV);
    const pd = prevDateOf(date), prev = {};
    if (pd) FD_.rankAt(G.stocks, mk, pd, S.W, S.cfg.minTV).forEach((o) => (prev[o.st.code] = o.rank));
    rk.forEach((o) => (o.prev = pd ? prev[o.st.code] : undefined));
    return rk;
  }
  function rowRank(o, held, date) {
    const m = o.sc.metrics, sg = FD_.signal(o.sc, { held: false, cfg: S.cfg });
    let chg = '<small class="mute">–</small>';
    if (o.prev === undefined) chg = '<small class="mute">NEW</small>';
    else if (o.prev - o.rank > 0) chg = `<small class="up">▲${o.prev - o.rank}</small>`;
    else if (o.prev - o.rank < 0) chg = `<small class="dn">▼${o.rank - o.prev}</small>`;
    return `<button class="item" data-act="stock" data-code="${o.st.code}" data-date="${date}">
      <div class="rk ${o.rank <= 3 ? 'first' : ''}"><b>${o.rank}</b>${chg}</div>
      <div class="main"><div class="nm">${esc(o.st.name)}${held ? '<span class="chip tag c-own">보유</span>' : ''}</div>
        <div class="sub">${o.st.code} · ${esc(o.st.sector)}</div>
        <div class="tags">${chipSig(sg)}${FD_.tags(o.sc).slice(0, 2).map((t) => `<span class="chip tag">${esc(t)}</span>`).join('')}</div></div>
      <div class="px num"><b>${fn(m.px)}</b><small class="${cls(m.ret1)}">${arrow(m.ret1)} ${fpct(m.ret1 * 100, 2)}</small></div>
      ${ring(o.sc.total, 42)}</button>`;
  }
  function rowHold(r) {
    const m = r.sc && r.sc.metrics;
    return `<button class="item" data-act="stock" data-code="${r.code}" data-date="${G.asOf}">
      <div class="main"><div class="nm">${esc(r.st ? r.st.name : r.code)}${r.sig ? chipSig(r.sig) : '<span class="chip tag">데이터 없음</span>'}</div>
        <div class="sub num">${fn(r.qty)}주 · 평단 ${fn(r.avg)} · 비중 ${(r.weight * 100).toFixed(1)}%</div>
        <div class="bar" style="margin-top:6px"><i style="width:${Math.min(100, r.weight * 100 * 2.5)}%;background:var(--accent)"></i></div></div>
      <div class="px num"><b>${r.noData ? '-' : fn(r.px)}</b><small class="${cls(r.pnlPct)}">${arrow(r.pnlPct)} ${fpct(r.pnlPct)}</small>
        <small class="${cls(r.pnl)}" style="display:block">${fsign(r.pnl)}원</small></div>
      ${r.sc ? ring(r.sc.total, 42) : ''}</button>`;
  }
  const SUGG_IC = { warn: '!', exit: '✕', reduce: '↓', add: '＋', new: '★', info: 'i' };
  function suggHTML(list, max) {
    return list.slice(0, max || 99).map((s) => `<button class="sugg k-${s.kind}" ${s.code ? `data-act="stock" data-code="${s.code}" data-date="${G.asOf}"` : 'disabled'}>
      <span class="ic" aria-hidden="true">${SUGG_IC[s.kind]}</span><span><b>${esc(s.title)}</b><p>${esc(s.body)}</p></span></button>`).join('');
  }

  /* ---------- 화면: 홈 ---------- */
  function viewHome() {
    const an = FD_.analyzePortfolio(S.trades, G.byCode, G.asOf, S.W, S.cfg, S.cash);
    const sg = allSugg(an).sg;
    let h = '';
    if (an.rows.length) {
      h += `<div class="card"><div class="row"><div class="k ink2" style="font-size:13px">총 자산</div><span class="sp"></span>${an.wScore != null ? `<span class="ink2" style="font-size:13px">포트 매력도</span>${ring(an.wScore, 38)}` : ''}</div>
        <div class="big num">${fn(an.totalAsset)}<small style="font-size:14px;font-weight:500">원</small></div>
        <div class="num ${cls(an.pnl)}" style="font-size:14px;margin-top:2px">${arrow(an.pnl)} 평가손익 ${fsign(an.pnl)}원 (${fpct(an.pnlPct)})</div></div>`;
    } else {
      h += `<div class="card empty"><b>보유종목을 등록하면 운용 전략을 받을 수 있어요</b>매수 기록을 남기면 평가손익, 비중, 종목별 매도·매수 신호를 계산합니다.
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-act="trade-new" data-side="buy">보유종목 등록</button><button class="btn ghost" data-act="sample-portfolio">샘플 포트로 체험</button></div></div>`;
    }
    h += `<div class="sec-h"><h2>시장 온도</h2><span>${G.asOf} 종가 기준</span></div><div class="tiles">`;
    for (const mk of ['KOSPI', 'KOSDAQ']) {
      const ms = FD_.marketStats(G.stocks, mk, G.asOf, S.W);
      h += `<button class="tile" style="border:0;text-align:left" data-act="goto-rank" data-mk="${mk}"><div class="k">${mk} 평균 매력도</div><div class="v num">${ms.avg.toFixed(0)}점</div>
        <div class="s num">20일선 위 ${ms.above.toFixed(0)}% · <span class="up">${ms.up}↑</span> <span class="dn">${ms.dn}↓</span></div>
        <div class="s num ${cls(ms.flow5)}">5일 수급 ${fsign(ms.flow5)}억</div></button>`;
    }
    h += '</div>';
    h += `<div class="sec-h"><h2>오늘의 액션</h2><span>${an.rows.length ? '보유종목 기준' : '신규 후보'}</span></div><div class="card">`;
    if (an.rows.length) h += sg.length ? suggHTML(sg, 5) : '<div class="empty">지금 조정이 필요한 항목이 없습니다.</div>';
    else {
      const cand = [];
      for (const mk of ['KOSPI', 'KOSDAQ']) rankRows(mk, G.asOf).slice(0, 5).forEach((o) => { if (FD_.signal(o.sc, { held: false, cfg: S.cfg }).level === 'buy') cand.push({ kind: 'new', code: o.st.code, title: `${o.st.name} 신규 매수 후보 (${mk} ${o.rank}위)`, body: FD_.signal(o.sc, { held: false, cfg: S.cfg }).reasons[0] }); });
      h += cand.length ? suggHTML(cand, 4) : '<div class="empty">오늘은 매수 신호가 뚜렷한 종목이 없습니다.</div>';
    }
    h += '</div>';
    for (const mk of ['KOSPI', 'KOSDAQ']) {
      h += `<div class="sec-h"><h2>${mk} 매력도 TOP3</h2><button class="btn sm soft" data-act="goto-rank" data-mk="${mk}">TOP10 보기</button></div><div class="card list">`;
      const held = heldQty();
      h += rankRows(mk, G.asOf).slice(0, 3).map((o) => rowRank(o, held[o.st.code] && held[o.st.code].qty > 0, G.asOf)).join('');
      h += '</div>';
    }
    return h + homeExtra();
  }

  /* ---------- 화면: 포트폴리오 ---------- */
  const PAL = ['#0b7a75', '#d28a00', '#8a63d2', '#2563d6', '#cc5f12', '#b4236b', '#5b6b7c'];
  function viewPortfolio() {
    const an = FD_.analyzePortfolio(S.trades, G.byCode, G.asOf, S.W, S.cfg, S.cash);
    let h = `<div class="row" style="margin-bottom:10px"><button class="btn" data-act="trade-new" data-side="buy">＋ 매수 기록</button><button class="btn ghost" data-act="trade-new" data-side="sell">매도 기록</button><span class="sp"></span><button class="btn sm soft" data-act="cash-open">예수금 ${fwon(S.cash)}</button></div>`;
    if (!an.rows.length) return h + `<div class="card empty"><b>등록된 보유종목이 없습니다</b>매수 기록을 남기면 이곳에 포트폴리오가 만들어집니다.
      <div style="margin-top:12px"><button class="btn ghost" data-act="sample-portfolio">샘플 포트로 체험</button></div></div>`;
    h += `<div class="card"><div class="tiles">
      <div class="tile"><div class="k">평가금액</div><div class="v num">${fwon(an.mvTotal)}</div><div class="s num">매입 ${fwon(an.costTotal)}</div></div>
      <div class="tile"><div class="k">평가손익</div><div class="v num ${cls(an.pnl)}">${arrow(an.pnl)} ${fpct(an.pnlPct)}</div><div class="s num ${cls(an.pnl)}">${fsign(an.pnl)}원</div></div>
      <div class="tile"><div class="k">포트 매력도</div><div class="v num">${an.wScore != null ? an.wScore.toFixed(0) + '점' : '-'}</div><div class="s">평가금액 가중 평균</div></div>
      <div class="tile"><div class="k">현금 비중</div><div class="v num">${an.cashPct.toFixed(1)}%</div><div class="s num">실현손익 <span class="${cls(an.realized)}">${fsign(an.realized)}원</span></div></div></div></div>`;
    const secs = Object.entries(an.sectorW).sort((a, b) => b[1] - a[1]);
    h += `<div class="card"><h2>업종 비중<small>평가금액 기준</small></h2><div class="stack" role="img" aria-label="업종 비중">${secs.map(([k, v], i) => `<i style="width:${(v / an.mvTotal) * 100}%;background:${PAL[i % PAL.length]}"></i>`).join('')}</div>
      <div class="legend num">${secs.map(([k, v], i) => `<span><i style="background:${PAL[i % PAL.length]}"></i>${esc(k)} ${((v / an.mvTotal) * 100).toFixed(0)}%</span>`).join('')}</div>
      <div class="hint">시장별: ${Object.entries(an.marketW).map(([k, v]) => `${k} ${((v / an.mvTotal) * 100).toFixed(0)}%`).join(' · ')}</div></div>`;
    const as_ = allSugg(an), sg = as_.sg;
    h += riskCard(as_.rk);
    h += `<div class="sec-h"><h2>포트 운용 전략</h2><span>${G.asOf} 종가 기준</span></div><div class="card">${sg.length ? suggHTML(sg) : '<div class="empty">조정이 필요한 항목이 없습니다. 현재 구성을 유지하세요.</div>'}</div>`;
    h += rebalCard(an);
    h += dartCard(holdItems(an), '보유종목') + newsCard(holdItems(an), '보유종목');
    h += `<div class="sec-h"><h2>보유종목 ${an.rows.length}</h2><span>평가금액 순</span></div><div class="card list">${an.rows.map(rowHold).join('')}</div>`;
    return h;
  }

  /* ---------- 화면: TOP10 ---------- */
  function viewRank() {
    const d = UI.rankDate, i = G.rankDates.indexOf(d);
    const rk = rankRows(UI.mk, d).slice(0, 10), held = heldQty();
    let h = `<div class="seg" role="group" aria-label="시장 선택">${['KOSPI', 'KOSDAQ', 'ETF'].map((m) => `<button data-act="mk" data-mk="${m}" aria-pressed="${UI.mk === m}">${m}</button>`).join('')}</div>
      <div class="datebar"><button class="iconbtn" data-act="rdate" data-dir="-1" aria-label="이전 거래일" ${i <= 0 ? 'disabled' : ''}>◀</button>
        <input class="in" type="date" id="rank-date" value="${d}" min="${G.rankDates[0]}" max="${G.asOf}" aria-label="기준일">
        <button class="iconbtn" data-act="rdate" data-dir="1" aria-label="다음 거래일" ${i >= G.rankDates.length - 1 ? 'disabled' : ''}>▶</button></div>`;
    h += `<div class="card list">${rk.length ? rk.map((o) => rowRank(o, held[o.st.code] && held[o.st.code].qty > 0, d)).join('') : '<div class="empty">이 날짜에 평가할 종목이 없습니다. 거래대금 하한(설정)을 낮춰 보세요.</div>'}</div>
      <div class="row"><button class="btn soft" data-act="copy-rank">TOP10 리포트 복사</button><span class="hint">순위 변동은 직전 거래일 대비</span></div>
      <p class="foot">매력도 = 추세 ${S.W.trend} · 수급 ${S.W.flow} · 모멘텀 ${S.W.mom} · 거래량 ${S.W.vol} · 가치/안전성 ${S.W.risk} 가중 평균(0~100점). 종가·외국인·기관 수급만 사용하며 해당 일자까지의 데이터로 계산합니다. 평균 거래대금 ${S.cfg.minTV}억원 미만 종목은 제외됩니다.</p>`;
    return h;
  }

  /* ---------- 화면: 매매일지 ---------- */
  function viewJournal() {
    const { rpnl } = FD_.computePositions(S.trades);
    const sells = S.trades.filter((t) => t.side === 'sell');
    const tot = sells.reduce((s, t) => s + (rpnl[t.id] ? rpnl[t.id].pnl : 0), 0);
    const wins = sells.filter((t) => rpnl[t.id] && rpnl[t.id].pnl > 0).length;
    let h = `<div class="card"><div class="tiles">
      <div class="tile"><div class="k">실현손익</div><div class="v num ${cls(tot)}">${fsign(tot)}원</div></div>
      <div class="tile"><div class="k">매도 승률</div><div class="v num">${sells.length ? ((wins / sells.length) * 100).toFixed(0) + '%' : '-'}</div><div class="s">${wins}승 ${sells.length - wins}패 · 총 ${S.trades.length}건</div></div></div></div>
      <div class="row" style="margin-bottom:10px"><div class="seg sp" role="group" aria-label="거래 구분">${[['all', '전체'], ['buy', '매수'], ['sell', '매도']].map(([k, l]) => `<button data-act="filter" data-f="${k}" aria-pressed="${UI.filter === k}">${l}</button>`).join('')}</div>
      <button class="btn" data-act="trade-new" data-side="buy">＋ 기록</button></div>`;
    const list = S.trades.filter((t) => UI.filter === 'all' || t.side === UI.filter).sort((a, b) => (a.date === b.date ? b.id - a.id : a.date < b.date ? 1 : -1));
    if (!list.length) return h + '<div class="card empty"><b>거래 기록이 없습니다</b>매수·매도 내역을 남기면 평단과 실현손익이 자동 계산됩니다.</div>';
    let last = '';
    h += '<div class="card" style="padding-top:6px">';
    for (const t of list) {
      if (t.date !== last) { h += `<div class="day">${t.date}</div>`; last = t.date; }
      const st = G.byCode[t.code], r = rpnl[t.id];

  }

  /* ---------- 상세 시트 ---------- */
  function chartSVG(st, t, days) {
    const ind = FD_.getInd(st), s = Math.max(0, t - days + 1), n = t - s + 1;
    const W = 340, H = 150, FH = 46, GAP = 8, padB = 12;
    const cl = st.c.slice(s, t + 1), m20 = ind.ma20.slice(s, t + 1), m60 = ind.ma60.slice(s, t + 1);
    const vals = cl.concat(m20.filter((x) => x != null), m60.filter((x) => x != null));
    const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    const x = (i) => 2 + (W - 4) * (i / (n - 1)), y = (v) => 8 + (H - 8 - padB) * (1 - (v - lo) / (hi - lo || 1));
    const path = (a) => { let d = '', on = false; a.forEach((v, i) => { if (v == null) return; d += (on ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); on = true; }); return d; };
    const fl = [], mx = [];
    for (let i = s; i <= t; i++) fl.push(st.f[i] + st.i[i]);
    const ma = Math.max.apply(null, fl.map(Math.abs)) || 1, fy0 = H + GAP + FH / 2, bw = Math.max(1.2, (W - 4) / n - 1);
    let bars = '';
    fl.forEach((v, i) => { const hh = (Math.abs(v) / ma) * (FH / 2 - 1); bars += `<rect class="${v >= 0 ? 'c-fup' : 'c-fdn'}" x="${(x(i) - bw / 2).toFixed(1)}" y="${(v >= 0 ? fy0 - hh : fy0).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.5, hh).toFixed(1)}" rx="1"/>`; });
    UI.cd = { st, s, n, W, fl };
    return `<svg class="chart" id="chart" viewBox="0 0 ${W} ${H + GAP + FH + 12}" role="img" aria-label="${esc(st.name)} 최근 ${n}거래일 종가와 이동평균, 수급 차트">
      <line class="c-grid" x1="0" x2="${W}" y1="${y(hi)}" y2="${y(hi)}"/><line class="c-grid" x1="0" x2="${W}" y1="${y(lo)}" y2="${y(lo)}"/>
      <path class="c-m60" d="${path(m60)}"/><path class="c-m20" d="${path(m20)}"/><path class="c-px" d="${path(cl)}"/>
      <text x="3" y="${y(hi) - 2}">${fn(hi)}</text><text x="3" y="${y(lo) + 9}">${fn(lo)}</text>
      <line class="c-grid" x1="0" x2="${W}" y1="${fy0}" y2="${fy0}"/>${bars}
      <text x="3" y="${H + GAP + FH + 10}">${st.d[s].slice(5)}</text><text x="${W - 3}" y="${H + GAP + FH + 10}" text-anchor="end">${st.d[t].slice(5)}</text>
      <line id="xh" class="c-xh" x1="0" x2="0" y1="4" y2="${H + GAP + FH}" style="display:none"/></svg>`;
  }
  function sheetStock(code, date) {
    const st = G.byCode[code];
    if (!st) return '<p>종목 데이터를 찾을 수 없습니다.</p>';
    const t = FD_.idxOf(st, date) != null ? FD_.idxOf(st, date) : st.c.length - 1;
    const sc = FD_.scoreAt(st, t, S.W);
    if (!sc) return `<div class="hd"><h2>${esc(st.name)}</h2><button class="btn sm ghost" data-act="close">닫기</button></div><p>데이터가 ${MIN_IDX + 1}거래일 미만이라 평가할 수 없습니다.</p>`;
    const m = sc.metrics, pos = heldQty()[code], held = pos && pos.qty > 0;
    const pnlPct = held ? (m.px / pos.avg - 1) * 100 : null;
    const sg = FD_.signal(sc, { held, pnlPct, cfg: S.cfg });
    const wsum = Object.values(S.W).reduce((a, b) => a + b, 0) || 1;
    const expl = {
      trend: `종가 ${fn(m.px)} ${m.px > m.ma20 ? '>' : '<'} 20일선 ${fn(m.ma20)}, ${m.px > m.ma60 ? '>' : '<'} 60일선 ${fn(m.ma60)}`,
      flow: `5일 외인 ${fsign(m.foreign5, 0)}억 · 기관 ${fsign(m.inst5, 0)}억, 20일 합계 ${fsign(m.flow20, 0)}억`,
      mom: `RSI ${m.rsi.toFixed(0)}, MACD ${m.hist > 0 ? '강세' : '약세'}, 20일 수익률 ${fpct(m.ret20 * 100)}`,
      vol: `최근 5일 거래량이 20일 평균의 ${m.vr.toFixed(2)}배`,
      risk: `안전성 ${sc.parts.safe.toFixed(0)}점(20일 변동성 ${m.vol20.toFixed(1)}%, 120일 고점 대비 ${fpct(m.dd * 100)})` + (sc.val != null ? ` + 밸류에이션 ${sc.val.toFixed(0)}점을 절반씩 결합` : ' · 밸류에이션 자료가 없어 안전성만 반영'),
    };
    const ref = [];
    const lo20 = Math.min.apply(null, st.c.slice(t - 19, t + 1)), hi20 = Math.max.apply(null, st.c.slice(t - 19, t + 1));
    ref.push(['지지 (20일 최저 종가)', lo20], ['저항 (20일 최고 종가)', hi20], ['20일선', m.ma20], ['60일선', m.ma60]);
    if (held) { ref.push([`손절 참고 (평단 −${S.cfg.stopLoss}%)`, pos.avg * (1 - S.cfg.stopLoss / 100)], [`익절 참고 (평단 +${S.cfg.takeProfit}%)`, pos.avg * (1 + S.cfg.takeProfit / 100)]); }
    let h = `<div class="hd"><div><h2>${esc(st.name)}</h2><div class="sub mute" style="font-size:12px">${code} · ${st.market} · ${esc(st.sector)} · ${st.d[t]}</div></div><button class="btn sm ghost" data-act="close">닫기</button></div>
      <div class="card"><div class="row"><div><div class="big num">${fn(m.px)}<small style="font-size:13px;font-weight:500">원</small></div><div class="num ${cls(m.ret1)}">${arrow(m.ret1)} ${fpct(m.ret1 * 100, 2)} <span class="mute" style="font-size:12px">전일 대비</span></div></div><span class="sp"></span>${ring(sc.total, 58)}</div>
      <div class="row wrap" style="margin-top:10px">${chipSig(sg)}${FD_.tags(sc).map((x) => `<span class="chip tag">${esc(x)}</span>`).join('')}</div></div>
      <div class="card"><h2>전략 의견</h2>${sg.reasons.map((r) => `<p style="margin:0 0 6px;font-size:14px">${esc(r)}</p>`).join('')}
      <div style="margin-top:8px">${ref.map(([k, v]) => `<div class="row" style="justify-content:space-between;font-size:13px;padding:3px 0"><span class="ink2">${k}</span><b class="num">${fn(v)}</b></div>`).join('')}</div></div>
      <div class="card"><h2>최근 ${Math.min(90, t + 1)}거래일<small>종가 · 외인+기관 순매수</small></h2>${chartSVG(st, t, 90)}<div class="rd num" id="chart-read">차트를 터치하면 일별 값이 표시됩니다.</div>
      <div class="lg"><span><i style="background:var(--ink)"></i>종가</span><span><i style="background:#d28a00"></i>20일선</span><span><i style="background:#8a63d2"></i>60일선</span><span><i style="background:var(--up)"></i>순매수</span><span><i style="background:var(--dn)"></i>순매도</span></div></div>
      <div class="card"><h2>점수 구성<small>가중치 반영</small></h2>${PART.map(([k, l]) => `<div class="part"><span>${l} <small class="mute">${((S.W[k] / wsum) * 100).toFixed(0)}%</small></span><div class="bar"><i style="width:${sc.parts[k]}%;background:${sc.parts[k] >= 70 ? 'var(--s-hi)' : sc.parts[k] >= 50 ? 'var(--s-mid)' : 'var(--s-lo)'}"></i></div><b class="num">${sc.parts[k].toFixed(0)}</b></div><div class="expl">${esc(expl[k])}</div>`).join('')}</div>`;
    h += valCard(code, sc);
    if (held) h += `<div class="card"><h2>내 포지션</h2><div class="tiles"><div class="tile"><div class="k">수량 · 평단</div><div class="v num" style="font-size:15px">${fn(pos.qty)}주 · ${fn(pos.avg)}</div></div><div class="tile"><div class="k">평가손익</div><div class="v num ${cls(pnlPct)}" style="font-size:15px">${fpct(pnlPct)}</div><div class="s num ${cls(pnlPct)}">${fsign((m.px - pos.avg) * pos.qty)}원</div></div></div></div>`;
    h += `<div class="row"><button class="btn sp" data-act="trade-new" data-code="${code}" data-side="buy">매수 기록</button>${held ? `<button class="btn ghost sp" data-act="trade-new" data-code="${code}" data-side="sell">매도 기록</button>` : ''}</div>
      <button class="btn soft block" style="margin-top:8px" data-act="wl-toggle" data-code="${code}">${S.watch.some((w) => w.code === code) ? '★ 관심종목 해제' : '☆ 관심종목에 추가'}</button>

  }

function dartCard(items, title) {

/* ---------- 밸류에이션 (OpenDART 자동 계산, 독립 지표) ---------- */
function valCard(code, sc) {
  const v = G.byCode[code] && G.byCode[code].val;
  if (!v) return `<div class="card"><h2>밸류에이션<small>OpenDART 자동</small></h2><div class="empty" style="padding:6px">${VAL ? '이 종목의 재무 자료가 없습니다. ETF·신규 상장·우선주이거나 사업보고서가 아직 없는 종목일 수 있습니다. 매력도에는 반영되지 않습니다.' : '아직 연결되지 않았습니다. OpenDART 인증키(DART_KEY)를 등록하고 자동 갱신을 한 번 실행하면 전 종목의 PER·PBR·ROE가 자동으로 채워집니다.'}</div></div>`;
  const vs = sc && sc.val != null ? sc.val : FD_.valScore(v);
  const f = (x, u, neg) => (x == null ? '-' : x <= 0 && neg ? neg : x.toFixed(u === '%' ? 1 : Math.abs(x) < 10 ? 2 : 1) + u);
  return `<div class="card"><h2>밸류에이션<small>${v.fy || ''}년 사업보고서 기준 · 자동</small></h2>
    <div class="part"><span>밸류에이션 점수 <small class="mute">가치/안전성의 50%</small></span><div class="bar"><i style="width:${vs}%;background:${vs >= 70 ? 'var(--s-hi)' : vs >= 50 ? 'var(--s-mid)' : 'var(--s-lo)'}"></i></div><b class="num">${vs == null ? '-' : vs.toFixed(0)}</b></div>
    <div class="expl">PER ${f(v.per, '배', '적자')} · PBR ${f(v.pbr, '배', '자본잠식')} · ROE ${f(v.roe, '%')} — ${vs >= 70 ? '이익·자산 대비 싼 편' : vs <= 30 ? '이익·자산 대비 비싼 편' : '중간 수준'}</div>
    <div class="hint">OpenDART의 직전 사업연도 당기순이익·자본총계와 최근 시가총액으로 계산한 값이라, 증권사가 보여 주는 PER·PBR(지배주주 기준·추정치)과 조금 다를 수 있습니다.</div></div>`;
}

    if (el.id === 'rank-date') { const v = el.value; const c = G.rankDates.filter((x) => x <= v); UI.rankDate = c.length ? c[c.length - 1] : G.rankDates[0]; rerender(); return; }
    if (k === 'tfdate') { UI.tf.priceAuto = true; tfRefresh(); }
    if (k === 'range') {
      const id = el.id;
      if (id.startsWith('w-')) { S.W[id.slice(2)] = +el.value; S.profile = 'custom'; S.customW = Object.assign({}, S.W); } else S.cfg[id.slice(2)] = +el.value;
      store.save(); rerender();
    }
    if (k === 'file' && el.files[0]) { const rd = new FileReader(); rd.onload = () => { $('#im-text').value = String(rd.result).slice(0, 30e6); }; rd.readAsText(el.files[0]); }
  });
  document.addEventListener('pointermove', (e) => {
    const svg = e.target.closest && e.target.closest('#chart'); if (!svg || !UI.cd) return;
    const r = svg.getBoundingClientRect(), { st, s, n, W, fl } = UI.cd;
    const i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - r.left) / r.width * W - 2) / (W - 4) * (n - 1))));
    const xx = 2 + (W - 4) * (i / (n - 1)), xh = $('#xh'); xh.setAttribute('x1', xx); xh.setAttribute('x2', xx); xh.style.display = '';
    const g = s + i;
    $('#chart-read').innerHTML = `${st.d[g]} · 종가 <b>${fn(st.c[g])}</b> · 순매수 <span class="${cls(fl[i])}">${fsign(fl[i], 0)}억</span> (외인 ${fsign(st.f[g], 0)} / 기관 ${fsign(st.i[g], 0)})`;
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  /* ---------- 시작 ---------- */
  (async function boot() {
    $('#app').innerHTML = '<div class="empty" style="padding-top:40vh">불러오는 중…</div>';
    await store.init();
    applyState(await store.load());
    await loadData();
    render();
  })();
})();

</script>
<script>if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
