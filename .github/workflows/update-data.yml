name: update-data
on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pykrx pandas finance-datareader
      - run: python pipeline/update_data.py --out data
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data" && git push)
