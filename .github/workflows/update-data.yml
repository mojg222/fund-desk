name: update-data
on:
  schedule:
    - cron: '30 9 * * 1-5'   # 평일 18:30 (한국시간) — 장 마감 후 수급 확정 시점
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pykrx pandas finance-datareader
      - run: python pipeline/update_data.py --out data
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          NAVER_HUB_ID: ${{ secrets.NAVER_HUB_ID }}
          NAVER_HUB_SECRET: ${{ secrets.NAVER_HUB_SECRET }}
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F)" && git push)
